name: Deploy RAG Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build Spring backend
        working-directory: spring-backend
        run: mvn clean package -DskipTests

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Angular frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing GitHub secret SSH_HOST}"
          : "${SSH_PORT:?Missing GitHub secret SSH_PORT}"
          : "${SSH_PRIVATE_KEY:?Missing GitHub secret SSH_PRIVATE_KEY}"

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          echo "Checking SSH host key for configured host and port..."
          if ! ssh-keyscan -T 20 -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts; then
            echo "Could not reach SSH_HOST on SSH_PORT. Check DNS/IP, firewall, and that sshd is listening on this port."
            exit 1
          fi

      - name: Test SSH connection
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p "${{ secrets.SSH_PORT }}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "echo SSH connection OK"

      - name: Upload deployment artifacts
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "mkdir -p /tmp/rag-pipeline-deploy/frontend"

          scp -i ~/.ssh/deploy_key -P "${{ secrets.SSH_PORT }}" \
            spring-backend/target/rag-pipeline-spring-1.0.0-SNAPSHOT.jar \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/rag-pipeline-deploy/rag-pipeline-spring.jar"

          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }}" \
            frontend/dist/rag-pipeline-demo-angular/browser/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/rag-pipeline-deploy/frontend/"

      - name: Install artifacts and restart services
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" << 'EOF'
          set -e

          APP_DOMAIN="ragpipeline.exaultlabs.com"
          APP_ROOT="/var/www/rag-pipeline"
          NGINX_SITE="/etc/nginx/sites-available/rag-pipeline"
          NGINX_ENABLED="/etc/nginx/sites-enabled/rag-pipeline"
          CERT_PATH="/etc/letsencrypt/live/$APP_DOMAIN/fullchain.pem"
          KEY_PATH="/etc/letsencrypt/live/$APP_DOMAIN/privkey.pem"

          sudo mkdir -p /opt/rag-pipeline/backend
          sudo mkdir -p "$APP_ROOT"

          sudo cp /tmp/rag-pipeline-deploy/rag-pipeline-spring.jar /opt/rag-pipeline/backend/rag-pipeline-spring.jar
          sudo rsync -az --delete /tmp/rag-pipeline-deploy/frontend/ "$APP_ROOT/"

          write_http_config() {
          sudo tee "$NGINX_SITE" > /dev/null <<NGINX
          server {
            listen 80;
            server_name $APP_DOMAIN;

            root $APP_ROOT;
            index index.html;

            location / {
              try_files \$uri \$uri/ /index.html;
            }

            location /api/ {
              proxy_pass http://127.0.0.1:8080/;
              proxy_set_header Host \$host;
              proxy_set_header X-Real-IP \$remote_addr;
              proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto \$scheme;
            }
          }
          NGINX
          }

          write_https_config() {
          sudo tee "$NGINX_SITE" > /dev/null <<NGINX
          server {
            listen 80;
            server_name $APP_DOMAIN;
            return 301 https://\$host\$request_uri;
          }

          server {
            listen 443 ssl;
            server_name $APP_DOMAIN;

            ssl_certificate $CERT_PATH;
            ssl_certificate_key $KEY_PATH;

            root $APP_ROOT;
            index index.html;

            location / {
              try_files \$uri \$uri/ /index.html;
            }

            location /api/ {
              proxy_pass http://127.0.0.1:8080/;
              proxy_set_header Host \$host;
              proxy_set_header X-Real-IP \$remote_addr;
              proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto \$scheme;
            }
          }
          NGINX
          }

          if sudo test -f "$CERT_PATH" && sudo test -f "$KEY_PATH"; then
            echo "Existing TLS certificate found for $APP_DOMAIN. Keeping it and writing HTTPS Nginx config."
            write_https_config
          else
            echo "No TLS certificate found for $APP_DOMAIN. Writing HTTP config before certificate request."
            write_http_config
          fi

          if [ ! -L "$NGINX_ENABLED" ]; then
            sudo ln -s "$NGINX_SITE" "$NGINX_ENABLED"
          fi

          sudo nginx -t
          sudo systemctl reload nginx

          if ! sudo test -f "$CERT_PATH"; then
            if ! command -v certbot >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y certbot python3-certbot-nginx
            fi

            sudo certbot --nginx \
              -d "$APP_DOMAIN" \
              --non-interactive \
              --agree-tos \
              --register-unsafely-without-email \
              --redirect

            write_https_config
            sudo nginx -t
            sudo systemctl reload nginx
          else
            echo "Certificate already exists for $APP_DOMAIN. Not replacing it."
          fi

          sudo systemctl restart rag-pipeline
          sudo nginx -t
          sudo systemctl reload nginx
          EOF
